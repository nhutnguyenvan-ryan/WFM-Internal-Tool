              Đăng nhập bằng Google <IconArrowRight size={16}/>

          </div>
        )}

        {auth.role === 'none' && auth.user && (
          <div className="max-w-md mx-auto bg-white border border-ink/10 rounded-2xl shadow-card p-10 text-center">
            <span className="inline-block bg-shopee-light text-shopee text-[11px] font-extrabold tracking-widest uppercase px-3 py-1 rounded-full mb-4">Đang chờ duyệt</span>
            <h3 className="font-bold text-[18px] text-ink mb-2">Yêu cầu truy cập đã được gửi</h3>
            <p className="text-[13.5px] text-ink-3">Tài khoản <strong className="text-ink-2">{auth.user.email}</strong> chưa được cấp quyền. Vui lòng liên hệ Admin để được duyệt.</p>
          </div>
        )}

        {(auth.role === 'owner' || auth.role === 'member') && (
          <div>
            <div className="flex flex-col sm:flex-row gap-3 max-w-xl mx-auto mb-10">
              <div className="relative flex-1">
                <IconSearch size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-4"/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm kiếm công cụ..."
                  className="w-full h-12 rounded-full border border-ink/10 bg-white pl-11 pr-5 text-[14px] outline-none focus:border-shopee focus:ring-4 focus:ring-shopee-light transition-all"/>
              </div>
              {auth.role === 'owner' &&
                <button onClick={onOpenAdmin} className="h-12 px-5 rounded-full border border-ink/10 bg-white text-[13px] font-semibold text-ink-2 hover:bg-canvas transition-colors inline-flex items-center gap-2 justify-center">
                  <IconSettings size={16}/> Quản lý truy cập
                </button>}
            </div>

            <div className="space-y-10">
              {filtered.map(cat => (
                <div key={cat.name}>
                  <div className="flex items-center gap-2.5 mb-4">
                    <span className="w-1.5 h-5 rounded-sm bg-[#FF6600]"></span>
                    <h3 className="font-extrabold text-[14px] tracking-wide uppercase text-ink">{cat.name}</h3>
                    <span className="text-[11px] font-bold text-ink-3 bg-white border border-ink/10 rounded-full px-2.5 py-0.5">{cat.apps.length} Ứng Dụng</span>
                  </div>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {cat.apps.map(a => {
                      const hasLink = !!a.url;
                      const Tag = hasLink ? 'a' : 'div';
                      const extraProps = hasLink ? { href: a.url, target:'_blank', rel:'noopener' } : {};
                      return (
                        <Tag key={a.name} {...extraProps}
                          className={`relative bg-white border border-ink/10 rounded-2xl p-5 flex items-center gap-4 transition-all ${hasLink ? 'hover:shadow-card hover:-translate-y-1 hover:border-shopee/40 cursor-pointer' : 'opacity-60 cursor-not-allowed'}`}>
                          {hasLink
                            ? <IconExternal size={16} className="absolute top-3.5 right-3.5 text-ink-4"/>
                            : <span className="absolute top-3 right-3 text-[9px] font-extrabold uppercase bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">Chưa gắn link</span>}
                          
                          {/* KHUNG ICON 3D HÌNH ẢNH */}
                          <div className="w-12 h-12 rounded-xl bg-canvas flex items-center justify-center shrink-0 border border-black/5 p-2 shadow-inner">
                            <img src={a.img} className="w-full h-full object-contain" alt={a.name} />
                          </div>

                          <div className="min-w-0 pr-4">
                            <div className="font-bold text-[14px] text-ink truncate">{a.name}</div>
                            <div className="text-[11.5px] text-ink-3 truncate">{a.sub}</div>
                          </div>
                        </Tag>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

          <div className="mb-4 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 text-white backdrop-blur">

/* ═══════════════════════════════ ADMIN MODAL ═══════════════════════════════ */
function AdminModal({ onClose }) {
  const [members, setMembers] = useState([]);
  const [pending, setPending] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    fetch('/api/access').then(r=>r.json()).then(d => {
      setMembers(d.members || []); setPending(d.pending || []); setLoading(false);
    }).catch(()=>setLoading(false));
  };
  useEffect(load, []);

  const approve = (email) => fetch('/api/access/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) }).then(load);
  const deny = (email) => fetch(`/api/access/pending/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);
  const removeMember = (email) => fetch(`/api/access/members/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-white rounded-2xl w-full max-w-md max-h-[82vh] overflow-y-auto shadow-lifted">
        <div className="flex items-center justify-between px-6 py-4.5 border-b border-ink/10">
          <h3 className="font-extrabold text-[16px] text-ink">Quản lý truy cập</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-canvas text-ink-3"><IconX size={18}/></button>
        </div>
        <div className="p-6">
          {loading ? <div className="text-center text-[13px] text-ink-3 py-8">Đang tải...</div> : (
            <>
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mb-2.5">Yêu cầu chờ duyệt</div>
              {pending.length === 0 && <div className="text-[12.5px] text-ink-4 mb-5">Không có yêu cầu nào.</div>}
              {pending.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[13px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>approve(e)} className="bg-emerald-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-md">Duyệt</button>
                  <button onClick={()=>deny(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Từ chối</button>
                </div>
              ))}
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mt-6 mb-2.5">Thành viên đã duyệt</div>
              {members.length === 0 && <div className="text-[12.5px] text-ink-4">Chưa có thành viên nào.</div>}
              {members.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[13px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>removeMember(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Gỡ quyền</button>
                </div>
              ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════ APP ROOT ═══════════════════════════════ */
function App() {
  const [auth, setAuth] = useState({ role: 'loading', user: null });
  const [showAdmin, setShowAdmin] = useState(false);

  useEffect(() => {
    fetch('/api/me').then(r=>r.json()).then(d => setAuth({ user: d.user, role: d.user ? d.role : null }))
      .catch(() => setAuth({ user:null, role:null }));
  }, []);

  const goLogin = () => { window.location.href = '/auth/google'; };
  const goLogout = () => { window.location.href = '/auth/logout'; };
  const scrollToDashboard = () => document.getElementById('dashboard')?.scrollIntoView({ behavior:'smooth' });

  return (
    <div>
      <Navbar auth={auth} onLogin={goLogin} onLogout={goLogout} onOpenAdmin={()=>setShowAdmin(true)}/>
      <Hero onPrimaryCTA={scrollToDashboard}/>
      <Features/>
      <Dashboard auth={auth} onLogin={goLogin} onOpenAdmin={()=>setShowAdmin(true)}/>
      <Testimonials/>
      <CTABanner onLogin={goLogin}/>
      <Footer/>
      {showAdmin && <AdminModal onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
