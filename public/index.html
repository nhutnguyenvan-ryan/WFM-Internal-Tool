          <div className="max-w-md mx-auto bg-white border border-ink/10 rounded-2xl shadow-card p-10 text-center">
            <div className="w-14 h-14 rounded-2xl bg-primary-50 flex items-center justify-center mx-auto mb-5"><IconLock size={22} className="text-primary"/></div>
            <h3 className="font-bold text-[16px] mb-2">Cần đăng nhập để xem Dashboard</h3>
            <p className="text-[13px] text-ink-3 mb-6">Đăng nhập bằng tài khoản Google @shopee.com để truy cập danh sách công cụ.</p>
            <button onClick={onLogin} className="inline-flex items-center gap-2 bg-primary hover:bg-primary-600 text-white font-bold px-6 py-3 rounded-xl transition-colors">
              Đăng nhập bằng Google <IconArrowRight size={15}/>
            </button>
          </div>
        )}

        {auth.role === 'none' && auth.user && (
          <div className="max-w-md mx-auto bg-white border border-ink/10 rounded-2xl shadow-card p-10 text-center">
            <span className="inline-block bg-secondary-50 text-secondary-500 text-[10.5px] font-extrabold tracking-widest uppercase px-3 py-1 rounded-full mb-4">Đang chờ duyệt</span>
            <h3 className="font-bold text-[16px] mb-2">Yêu cầu truy cập đã được gửi</h3>
            <p className="text-[13px] text-ink-3">Tài khoản <strong className="text-ink-2">{auth.user.email}</strong> chưa được cấp quyền. Vui lòng liên hệ Admin để được duyệt.</p>
          </div>
        )}

        {(auth.role === 'owner' || auth.role === 'member') && (
          <div>
            <div className="flex flex-col sm:flex-row gap-3 max-w-xl mx-auto mb-10">
              <div className="relative flex-1">
                <IconSearch size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-4"/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tìm kiếm công cụ..."
                  className="w-full h-12 rounded-full border border-ink/10 bg-white pl-11 pr-5 text-[13.5px] outline-none focus:border-primary focus:ring-4 focus:ring-primary-50 transition-all"/>
              </div>
              {auth.role === 'owner' &&
                <button onClick={onOpenAdmin} className="h-12 px-5 rounded-full border border-ink/10 bg-white text-[13px] font-semibold text-ink-2 hover:bg-canvas transition-colors inline-flex items-center gap-2 justify-center">
                  <IconSettings size={15}/> Quản lý truy cập
                </button>}
            </div>

            <div className="space-y-10">
              {filtered.map(cat => (
                <div key={cat.name}>
                  <div className="flex items-center gap-2.5 mb-4">
                    <span className="w-1 h-5 rounded-sm bg-secondary-500"></span>
                    <h3 className="font-extrabold text-[13.5px] tracking-wide uppercase">{cat.name}</h3>
                    <span className="text-[10.5px] font-bold text-ink-3 bg-white border border-ink/10 rounded-full px-2.5 py-0.5">{cat.apps.length} Ứng Dụng</span>
                  </div>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                    {cat.apps.map(a => {
                      const hasLink = !!a.url;
                      const Tag = hasLink ? 'a' : 'div';
                      const extraProps = hasLink ? { href: a.url, target:'_blank', rel:'noopener' } : {};
                      return (
                        <Tag key={a.name} {...extraProps}
                          className={`relative bg-white border border-ink/10 rounded-xl p-4 flex items-center gap-3 transition-all ${hasLink ? 'hover:shadow-card hover:-translate-y-0.5 hover:border-primary-100 cursor-pointer' : 'opacity-55 cursor-not-allowed'}`}>
                          {hasLink
                            ? <IconExternal size={13} className="absolute top-3 right-3 text-ink-4"/>
                            : <span className="absolute top-2.5 right-2.5 text-[8.5px] font-extrabold uppercase bg-secondary-50 text-secondary-500 px-2 py-0.5 rounded-full">Chưa gắn link</span>}
                          <div className={`w-10 h-10 rounded-lg ${a.bg} flex items-center justify-center text-lg shrink-0`}>{a.icon}</div>
                          <div className="min-w-0">
                            <div className="font-bold text-[13px] truncate">{a.name}</div>
                            <div className="text-[11px] text-ink-3 truncate">{a.sub}</div>
                          </div>
                        </Tag>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

/* ═══════════════════════════════ TESTIMONIALS ═══════════════════════════════ */

  return (
    <section id="testimonials" className="max-w-7xl mx-auto px-5 sm:px-8 py-20 md:py-28">
      <div className="text-center max-w-2xl mx-auto mb-14">
        <span className="inline-block text-[11.5px] font-bold tracking-widest text-primary uppercase mb-3">Phản hồi nội bộ</span>
        <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight">Đội ngũ WFM nói gì</h2>
        <p className="mt-3 text-[12px] text-ink-4 italic">* Nội dung minh hoạ — cập nhật bằng phản hồi thật của team khi triển khai.</p>
      </div>
      <div className="grid md:grid-cols-3 gap-6">
        {TESTIMONIALS.map((t, i) => (
          <div key={i} className="bg-white border border-ink/10 rounded-2xl p-7 flex flex-col">
            <div className="flex gap-1 mb-4">
              {Array.from({length:5}).map((_,s) => <IconStar key={s} size={15} filled={s < t.rating} className={s < t.rating ? 'text-primary' : 'text-ink/15'}/>)}
            </div>
            <p className="text-[13.5px] text-ink-2 leading-relaxed flex-1">"{t.quote}"</p>
            <div className="flex items-center gap-3 mt-6 pt-5 border-t border-ink/5">
              <div className="w-9 h-9 rounded-full bg-secondary-50 text-secondary-500 text-[11px] font-extrabold flex items-center justify-center">
                {t.name.split(' ').map(w=>w[0]).join('').toUpperCase()}
              </div>
              <div>
                <div className="text-[13px] font-bold leading-tight">{t.name}</div>

/* ═══════════════════════════════ CTA BANNER ═══════════════════════════════ */

    <section className="max-w-7xl mx-auto px-5 sm:px-8 pb-20 md:pb-28">
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-primary via-primary-600 to-secondary-600 px-8 py-16 md:py-20 text-center">
        <div className="absolute -top-16 -left-16 w-64 h-64 bg-white/10 rounded-full blur-2xl"></div>
        <div className="absolute -bottom-16 -right-16 w-72 h-72 bg-white/10 rounded-full blur-2xl"></div>
        <div className="relative">
          <IconUsers size={30} className="text-white/80 mx-auto mb-5"/>
          <h2 className="text-2xl md:text-3xl font-extrabold text-white max-w-xl mx-auto leading-snug">
            Sẵn sàng tối ưu hoá vận hành đội ngũ WFM của bạn?
          </h2>
          <p className="mt-3 text-white/80 text-[14px] max-w-md mx-auto">Đăng nhập bằng tài khoản Shopee để truy cập toàn bộ công cụ ngay hôm nay.</p>
          <button onClick={onLogin} className="mt-8 inline-flex items-center gap-2 bg-white text-primary font-bold px-7 py-3.5 rounded-xl shadow-lifted hover:-translate-y-0.5 transition-all">
            Đăng nhập ngay <IconArrowRight size={17}/>
          </button>

/* ═══════════════════════════════ FOOTER ═══════════════════════════════ */
function Footer() {
  const cols = [
    { title:'Sản phẩm', links:[['Tính năng','#features'],['Dashboard','#dashboard'],['Đánh giá','#testimonials']] },
    { title:'Tài nguyên', links:[['Hướng dẫn sử dụng','#'],['Yêu cầu hỗ trợ','#'],['Changelog','#']] },
    { title:'Liên hệ', links:[['WFM Team','#'],['IT Helpdesk','#']] },
  ];
  return (

        <div>
          <div className="flex items-center gap-2.5 mb-4">
            <div className="w-8 h-8 rounded-lg bg-primary-50 flex items-center justify-center p-1"><img src="/assets/logo-icon.png" alt="Shopee" className="w-full h-full object-contain"/></div>
            <span className="font-extrabold text-white text-[14px]">WFM Internal Tool</span>
          </div>
          <p className="text-[12.5px] leading-relaxed max-w-[220px]">Shopee WFM AI Suite — nền tảng nội bộ cho lập lịch, dự báo và giám sát vận hành contact center.</p>
        </div>
        {cols.map(c => (
          <div key={c.title}>
            <div className="text-white text-[12px] font-bold uppercase tracking-wider mb-4">{c.title}</div>
            <div className="flex flex-col gap-2.5">
              {c.links.map(([label,href]) => <a key={label} href={href} className="text-[13px] hover:text-white transition-colors">{label}</a>)}
            </div>
          </div>

      </div>
      <div className="border-t border-white/10 py-6">
        <div className="max-w-7xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11.5px]">
          <span>© {new Date().getFullYear()} Shopee. Internal tool — không dùng ngoài mục đích công việc.</span>
          <span className="text-white/40">wfm-internal-tool.onrender.com</span>
        </div>
      </div>

/* ═══════════════════════════════ ADMIN MODAL ═══════════════════════════════ */
function AdminModal({ onClose }) {
  const [members, setMembers] = useState([]);
  const [pending, setPending] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    fetch('/api/access').then(r=>r.json()).then(d => {
      setMembers(d.members || []); setPending(d.pending || []); setLoading(false);
    }).catch(()=>setLoading(false));
  };
  useEffect(load, []);

  const approve = (email) => fetch('/api/access/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) }).then(load);
  const deny = (email) => fetch(`/api/access/pending/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);
  const removeMember = (email) => fetch(`/api/access/members/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-white rounded-2xl w-full max-w-md max-h-[82vh] overflow-y-auto shadow-lifted">
        <div className="flex items-center justify-between px-6 py-4.5 border-b border-ink/10">
          <h3 className="font-extrabold text-[15px]">Quản lý truy cập</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-canvas text-ink-3"><IconX size={17}/></button>
        </div>
        <div className="p-6">
          {loading ? <div className="text-center text-[13px] text-ink-3 py-8">Đang tải...</div> : (
            <>
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mb-2.5">Yêu cầu chờ duyệt</div>
              {pending.length === 0 && <div className="text-[12px] text-ink-4 mb-5">Không có yêu cầu nào.</div>}
              {pending.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[12.5px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>approve(e)} className="bg-green-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-md">Duyệt</button>
                  <button onClick={()=>deny(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Từ chối</button>
                </div>
              ))}
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mt-6 mb-2.5">Thành viên đã duyệt</div>
              {members.length === 0 && <div className="text-[12px] text-ink-4">Chưa có thành viên nào.</div>}
              {members.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[12.5px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>removeMember(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Gỡ quyền</button>
                </div>
              ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════ APP ROOT ═══════════════════════════════ */
function App() {
  const [auth, setAuth] = useState({ role: 'loading', user: null });
  const [showAdmin, setShowAdmin] = useState(false);

  useEffect(() => {
    fetch('/api/me').then(r=>r.json()).then(d => setAuth({ user: d.user, role: d.user ? d.role : null }))
      .catch(() => setAuth({ user:null, role:null }));
  }, []);

  const goLogin = () => { window.location.href = '/auth/google'; };
  const goLogout = () => { window.location.href = '/auth/logout'; };
  const scrollToDashboard = () => document.getElementById('dashboard').scrollIntoView({ behavior:'smooth' });

  return (
    <div>
      <Navbar auth={auth} onLogin={goLogin} onLogout={goLogout} onOpenAdmin={()=>setShowAdmin(true)}/>
      <Hero onPrimaryCTA={scrollToDashboard}/>
      <SocialProof/>
      <Features/>
      <Dashboard auth={auth} onLogin={goLogin} onOpenAdmin={()=>setShowAdmin(true)}/>
      <Testimonials/>
      <CTABanner onLogin={goLogin}/>
      <Footer/>
      {showAdmin && <AdminModal onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
