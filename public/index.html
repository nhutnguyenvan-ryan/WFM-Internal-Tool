<style>
  body { background:#F8FAFC; margin:0; padding:0; color:#0F172A; }
  
  /* Họa tiết lưới mờ công nghệ cao thay cho noise hạt rải rác */
  .bg-noise { 
    background-image: linear-gradient(to right, rgba(15, 23, 42, 0.03) 1px, transparent 1px), 
                      linear-gradient(to bottom, rgba(15, 23, 42, 0.03) 1px, transparent 1px); 
    background-size: 32px 32px; 
  }
  
  ::-webkit-scrollbar { width:6px; height:6px }
  ::-webkit-scrollbar-thumb { background:#CBD5E1; border-radius:4px }
  
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  .animate-float { animation: floatSlow 5s ease-in-out infinite; }

  /* Glow pulse dùng chung cho toàn tool */
  @keyframes pulseGlow {
    0%, 100%  { box-shadow: 0 0 0 0 var(--glow-color, rgba(239,68,68,.4)); }
    70%       { box-shadow: 0 0 0 8px var(--glow-color-end, rgba(239,68,68,0)); }
  }
  .animate-pulse-glow { animation: pulseGlow 2s cubic-bezier(0.4,0,0.6,1) infinite; }

  /* ── PARALLAX BACKDROP (Hero) ── */
  .parallax-layer{
    position:absolute; inset:-10% -5%; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(238,77,45,.06) 0, transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(17,51,102,.07) 0, transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(238,77,45,.04) 0, transparent 50%);
    will-change: transform;
  }
  .hero-gradient{
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
  }

  /* ── DASHBOARD GRADIENT BACKGROUND ── */
  .dashboard-gradient{
    background: #F8FAFC;
    position: relative;
  }
  .dashboard-gradient::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 10% 15%, rgba(238,77,45,.04) 0, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(17,51,102,.05) 0, transparent 40%);
  }
  .dashboard-gradient > *{ position:relative; z-index:1; }

  /* ── TILT & ELEVATION INTERACTIVE ── */
  .tilt-3d { 
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .25s cubic-bezier(0.16, 1, 0.3, 1), border-color .2s ease; 
    will-change: transform; 
  }

  /* ── GLOW EFFECT nâng cao cho CTA / thẻ highlight ── */
  .glow-ring{ position:relative; }
  .glow-ring::before{
    content:''; position:absolute; inset:-1px; border-radius:inherit; z-index:-1;
    background:linear-gradient(135deg,#EE4D2D,#113366,#EE4D2D);
    background-size:200% 200%; opacity:0; filter:blur(8px);
    transition:opacity .25s; animation: glowShift 4s ease infinite;
  }
  .glow-ring:hover::before{ opacity:.45 }
  @keyframes glowShift{
    0%,100%{ background-position:0% 50% }
    50%{ background-position:100% 50% }
  }

  /* ── UNDERLIGHT cho nav links ── */
  .nav-underlight{ position:relative; padding-bottom:3px; }
  .nav-underlight::after{
    content:''; position:absolute; left:50%; bottom:0; width:0; height:2px;
    background:#EE4D2D; border-radius:2px; transform:translateX(-50%);
    box-shadow:0 0 6px rgba(238,77,45,.5);
    transition:width .25s ease;
  }
  .nav-underlight:hover::after{ width:100%; }

  /* ── APP DESC TOOLTIP ── */
  .app-desc-tooltip{
    position:absolute; left:0; top:calc(100% + 8px); z-index:30;
    max-width:240px; width:max-content;
    background:#0F172A; color:#fff; font-size:11.5px; line-height:1.5;
    padding:8px 12px; border-radius:8px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.12);
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
    pointer-events:none;
  }
  .group\/appdesc:hover .app-desc-tooltip{
    opacity:1; visibility:visible; transform:translateY(0);
  }

  /* Ẩn các icon emoji lơ lửng để giao diện trông sang trọng, đạt chuẩn B2B SaaS Enterprise */
  .hero-float-icon { display: none !important; }
</style>

/* ═══════════════════════════════ NAVBAR ═══════════════════════════════ */
function Navbar({ auth, onLogin, onLogout, onOpenAdmin, pending = [] }) {
  const [open, setOpen] = useState(false);
  const [showTip, setShowTip] = useState(false);
  return (
    <header className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/60 shadow-sm transition-all">

        <div className="hidden md:flex items-center gap-3">
          {auth.role && auth.role !== 'none' && auth.role !== 'loading' ? (
            <>

                <div className="relative"

/* ═══════════════════════════════ ADMIN MODAL ═══════════════════════════════ */
function AdminModal({ onClose }) {
  const [members, setMembers] = useState([]);
  const [pending, setPending] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    fetch('/api/access').then(r=>r.json()).then(d => {
      setMembers(d.members || []); setPending(d.pending || []); setLoading(false);
    }).catch(()=>setLoading(false));
  };
  useEffect(load, []);

  const approve = (email) => fetch('/api/access/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) }).then(load);
  const deny = (email) => fetch(`/api/access/pending/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);
  const removeMember = (email) => fetch(`/api/access/members/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-white rounded-2xl w-full max-w-md max-h-[82vh] overflow-y-auto shadow-lifted border border-slate-200">
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 className="font-extrabold text-[15px] text-ink">Access Control Management</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-canvas text-ink-3"><IconX size={18}/></button>
        </div>
        <div className="p-6">
          {loading ? <div className="text-center text-[13px] text-ink-3 py-8">Loading data...</div> : (
            <>
              <div className="text-[10.5px] font-extrabold uppercase tracking-wider text-ink-3 mb-2.5">Pending Requests</div>
              {pending.length === 0 && <div className="text-[12.5px] text-ink-4 mb-5">No pending requests.</div>}
              {pending.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-slate-200/80 rounded-lg px-3 py-2 mb-2 text-[12.5px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>approve(e)} className="bg-emerald-600 text-white text-[11px] font-bold px-3 py-1 rounded-md">Approve</button>
                  <button onClick={()=>deny(e)} className="border border-slate-200 text-ink-3 text-[11px] font-bold px-3 py-1 rounded-md">Reject</button>
                </div>
              ))}
              <div className="text-[10.5px] font-extrabold uppercase tracking-wider text-ink-3 mt-6 mb-2.5">Authorized Members</div>
              {members.length === 0 && <div className="text-[12.5px] text-ink-4">No active members found.</div>}
              {members.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-slate-200/80 rounded-lg px-3 py-2 mb-2 text-[12.5px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>removeMember(e)} className="border border-slate-200 text-ink-3 text-[11px] font-bold px-3 py-1 rounded-md">Revoke Access</button>
                </div>
              ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════ APP ROOT ═══════════════════════════════ */
function App() {
  const [auth, setAuth] = useState({ role: 'loading', user: null });
  const [showAdmin, setShowAdmin] = useState(false);
  const [pending, setPending] = useState([]);

  useEffect(() => {
    fetch('/api/me').then(r=>r.json()).then(d => setAuth({ user: d.user, role: d.user ? d.role : null }))
      .catch(() => setAuth({ user:null, role:null }));
  }, []);

  // Poll số yêu cầu truy cập đang chờ — chỉ khi là Owner, mỗi 20s
  const refreshPending = () => {
    fetch('/api/access').then(r=>r.json()).then(d => setPending(d.pending || [])).catch(()=>{});
  };
  useEffect(() => {
    if (auth.role !== 'owner') return;
    refreshPending();
    const id = setInterval(refreshPending, 20000);
    return () => clearInterval(id);
  }, [auth.role]);

  const goLogin = () => { window.location.href = '/auth/google'; };
  const goLogout = () => { window.location.href = '/auth/logout'; };
  const scrollToDashboard = () => document.getElementById('dashboard')?.scrollIntoView({ behavior:'smooth' });
  const openAdmin = () => setShowAdmin(true);
  const closeAdmin = () => { setShowAdmin(false); refreshPending(); };

  return (
    <div>
      <Navbar auth={auth} onLogin={goLogin} onLogout={goLogout} onOpenAdmin={openAdmin} pending={pending}/>
      <Hero onPrimaryCTA={scrollToDashboard}/>
      <Features/>
      <Dashboard auth={auth} onLogin={goLogin} onOpenAdmin={openAdmin}/>
      <Testimonials/>
      <CTABanner onLogin={goLogin}/>
      <Footer/>
      {showAdmin && <AdminModal onClose={closeAdmin}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- ═══════════════════════════ EFFECTS: Parallax · Tilt ═══════════════════════════ -->
<script>
(function(){
  // ── Parallax cho lớp nền Hero ──
  var parallaxTicking = false;
  function updateParallax(){
    var layer = document.getElementById('parallaxLayer');
    if (layer) {
      var y = window.scrollY || 0;
      layer.style.transform = 'translateY(' + (y * 0.2) + 'px)';
    }
    parallaxTicking = false;
  }
  window.addEventListener('scroll', function(){
    if (!parallaxTicking) { requestAnimationFrame(updateParallax); parallaxTicking = true; }
  }, { passive: true });

  // ── Mouse hover elevation nhẹ ──
  document.addEventListener('mousemove', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (!card) return;
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    var rx = (0.5 - py) * 4;
    var ry = (px - 0.5) * 4;
    card.style.transform = 'perspective(1000px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-2px)';
  });
  document.addEventListener('mouseout', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
      card.style.transform = '';
    }
  });
})();
</script>
