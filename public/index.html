<style>
  body { background:#F9FAFB; margin:0; padding:0; }
  .bg-noise { background-image: radial-gradient(circle at 1px 1px, rgba(15,18,34,.05) 1px, transparent 0); background-size: 22px 22px; }
  ::-webkit-scrollbar { width:6px; height:6px }
  ::-webkit-scrollbar-thumb { background:#DDE1ED; border-radius:4px }
  
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  .animate-float { animation: floatSlow 4s ease-in-out infinite; }

  /* Glow pulse dùng chung cho toàn tool — badge thông báo, CTA nổi bật, chỉ báo "live"...
     Mặc định màu đỏ (cảnh báo/thông báo mới); truyền --glow-color qua style inline để đổi màu khi cần. */
  @keyframes pulseGlow {
    0%, 100%  { box-shadow: 0 0 0 0 var(--glow-color, rgba(239,68,68,.55)); }
    70%       { box-shadow: 0 0 0 9px var(--glow-color-end, rgba(239,68,68,0)); }
  }
  .animate-pulse-glow { animation: pulseGlow 1.8s cubic-bezier(0.4,0,0.6,1) infinite; }

  /* Custom cursor đã được gỡ bỏ theo yêu cầu — dùng con trỏ mặc định của trình duyệt. */

  /* ── PARALLAX BACKDROP (Hero) ── */
  .parallax-layer{
    position:absolute; inset:-10% -5%; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(238,77,45,.08) 0, transparent 42%),
      radial-gradient(circle at 85% 20%, rgba(17,51,102,.10) 0, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(238,77,45,.05) 0, transparent 45%);
    will-change: transform;
  }
  .hero-gradient{
    background: linear-gradient(150deg, #FFF9F6 0%, #FFFFFF 45%, #EFF4FF 100%);
  }

  /* ── 3D TILT INTERACTIVE ── */
  .tilt-3d{ transition: transform .12s ease-out, box-shadow .2s ease; transform-style: preserve-3d; will-change: transform; }

  /* ── GLOW EFFECT nâng cao cho CTA / thẻ highlight ── */
  .glow-ring{ position:relative; }
  .glow-ring::before{
    content:''; position:absolute; inset:-2px; border-radius:inherit; z-index:-1;
    background:linear-gradient(135deg,#EE4D2D,#113366,#EE4D2D);
    background-size:220% 220%; opacity:0; filter:blur(10px);
    transition:opacity .25s; animation: glowShift 4s ease infinite;
  }
  .glow-ring:hover::before{ opacity:.55 }
  @keyframes glowShift{
    0%,100%{ background-position:0% 50% }
    50%{ background-position:100% 50% }
  }
  /* ── UNDERLIGHT cho nav links (Features / Dashboard / Testimonials) ──
     Vệt sáng cam trượt ra từ giữa khi hover, có glow nhẹ phía dưới chữ. */
  .nav-underlight{ position:relative; padding-bottom:3px; }
  .nav-underlight::after{
    content:''; position:absolute; left:50%; bottom:0; width:0; height:2px;
    background:#EE4D2D; border-radius:2px; transform:translateX(-50%);
    box-shadow:0 0 8px rgba(238,77,45,.7);
    transition:width .25s ease;
  }
  .nav-underlight:hover::after{ width:100%; }

  /* ── APP DESC TOOLTIP ── hiển thị full text mô tả (bị truncate) khi hover ── */
  .app-desc-tooltip{
    position:absolute; left:0; top:calc(100% + 6px); z-index:30;
    max-width:220px; width:max-content;
    background:#113366; color:#fff; font-size:11.5px; line-height:1.5;
    padding:8px 11px; border-radius:8px; box-shadow:0 8px 20px rgba(17,51,102,.25);
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
    pointer-events:none;
  }
  .group\/appdesc:hover .app-desc-tooltip{
    opacity:1; visibility:visible; transform:translateY(0);
  }
  /* ── HERO FLOATING DECOR ICONS ── */
  .hero-float-icon{
    position:absolute; z-index:1; font-size:32px; opacity:.9;
    filter:drop-shadow(0 6px 14px rgba(17,51,102,.18));
    pointer-events:none; user-select:none;
  }
  @media (max-width:900px){ .hero-float-icon{ display:none; } }
</style>
</head>

/* ═══════════════════════════════ NAVBAR ═══════════════════════════════ */
function Navbar({ auth, onLogin, onLogout, onOpenAdmin, pending = [] }) {
  const [open, setOpen] = useState(false);
  const [showTip, setShowTip] = useState(false);

        <div className="hidden md:flex items-center gap-3">
          {auth.role && auth.role !== 'none' && auth.role !== 'loading' ? (
            <>
              {auth.role === 'owner' &&

/* ═══════════════════════════════ ADMIN MODAL ═══════════════════════════════ */
function AdminModal({ onClose }) {
  const [members, setMembers] = useState([]);
  const [pending, setPending] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    fetch('/api/access').then(r=>r.json()).then(d => {
      setMembers(d.members || []); setPending(d.pending || []); setLoading(false);
    }).catch(()=>setLoading(false));
  };
  useEffect(load, []);

  const approve = (email) => fetch('/api/access/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) }).then(load);
  const deny = (email) => fetch(`/api/access/pending/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);
  const removeMember = (email) => fetch(`/api/access/members/${encodeURIComponent(email)}`, { method:'DELETE' }).then(load);

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-white rounded-2xl w-full max-w-md max-h-[82vh] overflow-y-auto shadow-lifted">
        <div className="flex items-center justify-between px-6 py-4.5 border-b border-ink/10">
          <h3 className="font-extrabold text-[16px] text-ink">Access Control Management</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-canvas text-ink-3"><IconX size={18}/></button>
        </div>
        <div className="p-6">
          {loading ? <div className="text-center text-[13px] text-ink-3 py-8">Loading data...</div> : (
            <>
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mb-2.5">Pending Requests</div>
              {pending.length === 0 && <div className="text-[12.5px] text-ink-4 mb-5">No pending requests.</div>}
              {pending.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[13px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>approve(e)} className="bg-emerald-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-md">Approve</button>
                  <button onClick={()=>deny(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Reject</button>
                </div>
              ))}
              <div className="text-[11px] font-extrabold uppercase tracking-wider text-ink-3 mt-6 mb-2.5">Authorized Members</div>
              {members.length === 0 && <div className="text-[12.5px] text-ink-4">No active members found.</div>}
              {members.map(e => (
                <div key={e} className="flex items-center gap-2 bg-canvas border border-ink/10 rounded-lg px-3 py-2.5 mb-2 text-[13px]">
                  <span className="flex-1 text-ink-2 truncate">{e}</span>
                  <button onClick={()=>removeMember(e)} className="border border-ink/10 text-ink-3 text-[11px] font-bold px-3 py-1.5 rounded-md">Revoke Access</button>
                </div>
              ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════ APP ROOT ═══════════════════════════════ */
function App() {
  const [auth, setAuth] = useState({ role: 'loading', user: null });
  const [showAdmin, setShowAdmin] = useState(false);
  const [pending, setPending] = useState([]);

  useEffect(() => {
    fetch('/api/me').then(r=>r.json()).then(d => setAuth({ user: d.user, role: d.user ? d.role : null }))
      .catch(() => setAuth({ user:null, role:null }));
  }, []);

  // Poll số yêu cầu truy cập đang chờ — chỉ khi là Owner, mỗi 20s
  const refreshPending = () => {
    fetch('/api/access').then(r=>r.json()).then(d => setPending(d.pending || [])).catch(()=>{});
  };
  useEffect(() => {
    if (auth.role !== 'owner') return;
    refreshPending();
    const id = setInterval(refreshPending, 20000);
    return () => clearInterval(id);
  }, [auth.role]);

  const goLogin = () => { window.location.href = '/auth/google'; };
  const goLogout = () => { window.location.href = '/auth/logout'; };
  const scrollToDashboard = () => document.getElementById('dashboard')?.scrollIntoView({ behavior:'smooth' });
  const openAdmin = () => setShowAdmin(true);
  const closeAdmin = () => { setShowAdmin(false); refreshPending(); };

  return (
    <div>
      <Navbar auth={auth} onLogin={goLogin} onLogout={goLogout} onOpenAdmin={openAdmin} pending={pending}/>
      <Hero onPrimaryCTA={scrollToDashboard}/>
      <Features/>
      <Dashboard auth={auth} onLogin={goLogin} onOpenAdmin={openAdmin}/>
      <Testimonials/>
      <CTABanner onLogin={goLogin}/>
      <Footer/>
      {showAdmin && <AdminModal onClose={closeAdmin}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- ═══════════════════════════ EFFECTS: Custom Cursor · Parallax · 3D Tilt ═══════════════════════════
     Script thuần JS, tách biệt hoàn toàn khỏi cây React ở trên — chỉ thêm hiệu ứng UI,
     không đụng tới bất kỳ state/logic/API call nào của ứng dụng gốc. -->
<script>
(function(){
  // ── Parallax cho lớp nền Hero khi cuộn trang ──
  var parallaxTicking = false;
  function updateParallax(){
    var layer = document.getElementById('parallaxLayer');
    if (layer) {
      var y = window.scrollY || 0;
      layer.style.transform = 'translateY(' + (y * 0.25) + 'px)';
    }
    parallaxTicking = false;
  }
  window.addEventListener('scroll', function(){
    if (!parallaxTicking) { requestAnimationFrame(updateParallax); parallaxTicking = true; }
  }, { passive: true });

  // ── 3D tilt hover cho mọi phần tử .tilt-3d (delegate vì React render động) ──
  document.addEventListener('mousemove', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (!card) return;
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    var rx = (0.5 - py) * 8;
    var ry = (px - 0.5) * 8;
    card.style.transform = 'perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-3px)';
  });
  document.addEventListener('mouseout', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
      card.style.transform = '';
    }
  });
})();
</script>
</body>
